services:
  - type: web
    name: delicious-sheri-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_GATE_PASSPHRASE
        sync: false
      - key: CUSTOMER_URL
        value: https://delicious-sheri.web.app
      - key: ADMIN_URL
        value: https://delicious-sheri-admin.web.app
      - key: RIDER_URL
        value: https://delicious-sheri-riders.web.app
      - key: FRONTEND_URL
        value: https://delicious-sheri-admin.web.app
      - key: EXTRA_CORS_ORIGINS
        value: https://delicious-sheri.firebaseapp.com,https://delicious-sheri-admin.firebaseapp.com,https://delicious-sheri-riders.firebaseapp.com
      - key: STORE_CITY
        value: Karachi
      - key: SMS_PROVIDER
        value: simulator
